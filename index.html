<style>
:root{--bg:#f3f1ee;--ink:#2b2926;--mute:#8a847c;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:28px;top:calc(22px + env(safe-area-inset-top,0px));pointer-events:none}
.top h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.top p{margin:6px 0 0;font-size:12px;color:var(--mute);letter-spacing:.08em}
.hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;letter-spacing:.08em;color:var(--mute);pointer-events:none;padding:0 16px}
#tip{position:fixed;pointer-events:none;padding:6px 12px;font-size:12px;letter-spacing:.06em;background:rgba(255,255,255,.92);border-radius:999px;box-shadow:0 4px 18px rgba(60,50,40,.12);opacity:0;transition:opacity .15s;transform:translate(14px,14px)}
#panel{position:fixed;right:28px;top:50%;width:min(340px,86vw);padding:28px;border-radius:20px;background:rgba(255,255,255,.94);box-shadow:0 20px 60px rgba(60,50,40,.16);transform:translate(24px,-50%);opacity:0;pointer-events:none;transition:.35s}
#panel.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#panel small{font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
#panel h2{margin:8px 0 12px;font-size:22px;font-weight:500}
#panel p{margin:0;font-size:14px;line-height:1.8;color:#59544e}
#panel .ph{margin-top:18px;padding:14px;border:1px dashed #d8d2ca;border-radius:12px;font-size:12px;color:var(--mute)}
#panel button{margin-top:20px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 20px;font-size:12px;letter-spacing:.1em;cursor:pointer}
@media(max-width:640px){#panel{right:50%;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(50%,24px)}#panel.on{transform:translate(50%,0)}.top{left:18px}}
</style>

   g.position.copy(PAD.p0).lerp(tp,e);g.quaternion.copy(PAD.q0).slerp(cam.quaternion.clone().multiply(Q90),e);g.scale.setScalar(PAD.k0+(k-PAD.k0)*e)}
  else{g.position.copy(PAD.p0);g.quaternion.copy(PAD.q0)}}
